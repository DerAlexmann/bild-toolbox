# --------------------------------------------------------------------------
# Bild-Toolbox ist ein einzelnes ausfuehrbares Skript und kein installierbares
# Paket - diese Datei enthaelt deshalb bewusst nur Werkzeug-Konfiguration
# (Linter und Testlauf) und keinen [project]-Abschnitt.
#
# Bild-Toolbox is a single runnable script rather than an installable package,
# so this file deliberately contains tooling configuration only.
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py39"
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle - Fehler
    "W",    # pycodestyle - Warnungen
    "F",    # Pyflakes
    "I",    # isort - Importreihenfolge
    "B",    # flake8-bugbear - typische Fallstricke
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade - veraltete Schreibweisen
    "RET",  # flake8-return
]
ignore = [
    # Die Farbnamen (BG, CARD, TEXT ...) werden von apply_theme() zur Laufzeit
    # per globals().update() angelegt. Das ist beabsichtigt und macht das
    # Umschalten des Farbschemas moeglich - statische Analyse kann es nicht
    # sehen, deshalb waeren es sonst mehrere hundert Fehlalarme.
    "F821",
]

[tool.ruff.lint.per-file-ignores]
# Die Tests laden das Skript ueber importlib und arbeiten mit dynamischen Namen.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

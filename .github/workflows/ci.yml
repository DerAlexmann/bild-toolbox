name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ruff installieren
        run: pip install -r requirements-dev.txt

      - name: Linting
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Tkinter wird beim Import des Skripts geladen. Unter Linux fehlen die
      # Tcl/Tk-Systembibliotheken auf einem nackten Runner.
      - name: Tcl/Tk nachinstallieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntaxpruefung
        run: python -m py_compile Bild-Toolbox.pyw

      - name: Tests
        run: python -m pytest

  optional-extras:
    name: Optionale Zusatzmodule installierbar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Stellt sicher, dass requirements-optional.txt nicht veraltet -
      # die Toolbox laeuft ohne diese Pakete, soll sie aber nutzen koennen.
      - name: Alles installieren
        run: pip install -r requirements.txt -r requirements-optional.txt

      - name: Import pruefen
        run: |
          python -c "import PIL, send2trash, icoextract, pillow_heif; print('alle Zusatzmodule geladen')"

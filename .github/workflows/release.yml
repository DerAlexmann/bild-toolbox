name: Release

# Baut bei einem Versions-Tag (z. B. v1.0.0) eine Windows-EXE und ein
# plattformunabhaengiges ZIP und haengt beides an einen GitHub-Release.
#
# Die EXE entsteht im --onefile-Modus. Damit Sprache und Farbschema einen
# Neustart ueberleben, erkennt app_folder() in Bild-Toolbox.pyw den gepackten
# Zustand (sys.frozen) und legt die Einstellungen neben der EXE ab statt in
# dem temporaeren Entpackordner, den PyInstaller bei jedem Start anlegt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quellpaket:
    name: Quellpaket (ZIP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ZIP packen
        run: |
          mkdir -p out/Bild-Toolbox
          cp Bild-Toolbox.pyw bild_toolbox.ico LICENSE NOTICE DRITTANBIETER-LIZENZEN.md \
             README.md README.en.md CHANGELOG.md requirements.txt \
             requirements-optional.txt out/Bild-Toolbox/
          cd out && zip -r "Bild-Toolbox-${GITHUB_REF_NAME}-quellen.zip" Bild-Toolbox

      - uses: actions/upload-artifact@v7
        with:
          name: quellpaket
          # Ohne "error" warnt die Action nur und der Release entsteht ohne
          # Quellpaket - GPLv2 und LGPLv3 verlangen aber den Quellcode.
          if-no-files-found: error
          path: out/*.zip

  windows-exe:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt pyinstaller

      # --collect-all pillow_heif ist eine Absicherung: Bild-Toolbox.pyw laedt
      # pillow-heif inzwischen mit einer gewoehnlichen import-Zeile, damit
      # PyInstaller es findet. Wuerde jemand das spaeter auf einen dynamischen
      # Import zurueckbauen, faenge dieses Flag den Fehler trotzdem ab - sonst
      # meldete die EXE stillschweigend "keine HEIC/HEIF-Unterstuetzung".
      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "Bild-Toolbox"
          --icon bild_toolbox.ico
          --collect-all pillow_heif
          Bild-Toolbox.pyw

      - name: Startet die EXE ueberhaupt?
        # Ein reiner Rauchtest: die EXE wird gestartet und nach wenigen
        # Sekunden beendet. Faellt sie sofort um, schlaegt der Job fehl.
        run: |
          $p = Start-Process -FilePath "dist\Bild-Toolbox.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Die EXE hat sich sofort beendet (Exit $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force
          Write-Output "EXE laeuft."

      - name: Pruefsumme
        # Die SHA-256 haengt als SHA256SUMS.txt am Release: Wer die EXE laedt,
        # kann sie vor dem ersten Start vergleichen - sie ist nicht signiert.
        run: |
          $h = (Get-FileHash "dist\Bild-Toolbox.exe" -Algorithm SHA256).Hash
          Write-Output "SHA-256: $h"
          "$h  Bild-Toolbox.exe" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"

      - name: Lizenzhinweise neben die EXE legen
        # Die EXE enthaelt Bibliotheken unter LGPLv3 und GPLv2. Deren Lizenzen
        # und Quellen muessen den Anwender mit erreichen, nicht nur das
        # Repository - deshalb haengt die Datei am Release.
        run: Copy-Item DRITTANBIETER-LIZENZEN.md dist/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          # Vorgabe waere "warn": Fehlt eine der drei Dateien, lieferte das
          # Release sie stillschweigend nicht mit - die Pruefsumme oder die
          # Lizenzhinweise fehlten, ohne dass etwas rot wird.
          if-no-files-found: error
          path: |
            dist/Bild-Toolbox.exe
            dist/SHA256SUMS.txt
            dist/DRITTANBIETER-LIZENZEN.md

  release:
    name: Release veroeffentlichen
    needs: [quellpaket, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefakte

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          draft: true          # erst pruefen, dann von Hand veroeffentlichen
          generate_release_notes: true
          # Vorgabe ist false: Ein Pfad, der nichts trifft, wuerde den Release
          # ohne diese Datei anlegen. Hier darf nichts fehlen.
          fail_on_unmatched_files: true
          files: |
            artefakte/quellpaket/*.zip
            artefakte/windows-exe/Bild-Toolbox.exe
            artefakte/windows-exe/SHA256SUMS.txt
            artefakte/windows-exe/DRITTANBIETER-LIZENZEN.md
